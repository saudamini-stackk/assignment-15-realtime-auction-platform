<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Auction & Bidding Engine | Raj Rasal (150096725066)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Outbid Alert Toast -->
  <div id="outbid-toast" class="alert-toast">⚠️ You have been outbid!</div>

  <!-- Header -->
  <header class="auction-header">
    <div class="brand-title">
      <span>🔨 LiveBid Sovereign</span>
      <span class="live-tag">LIVE FLOOR</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span id="viewers-count" style="font-size: 0.9rem; color: #94a3b8;">1 watching live</span>
      <span style="font-size: 0.9rem; font-weight: 600;">Bidder: <span id="my-bidder-name" style="color: #f59e0b;"></span></span>
    </div>
  </header>

  <!-- Auction Trading Floor -->
  <main class="auction-layout">
    <!-- Center Live Lot -->
    <section class="floor-card">
      <div id="auction-status-banner" style="display: none; padding: 16px; background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; border-radius: 10px; margin-bottom: 20px; font-weight: 700; text-align: center; color: #4ade80;"></div>

      <div class="lot-title" id="lot-title">1967 Vintage Fender Stratocaster</div>
      <p class="lot-desc" id="lot-desc">Loading auction specifications...</p>

      <!-- Price & Timer Board -->
      <div class="price-banner">
        <div>
          <div style="font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em;">Current Highest Bid</div>
          <div class="price-amount" id="leading-price">₹50,000</div>
          <div style="font-size: 0.9rem; color: #cbd5e1;">Top Bidder: <strong id="leading-bidder" style="color: #60a5fa;">None</strong></div>
        </div>

        <div class="timer-box">
          <div style="font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em;">Time Remaining</div>
          <div class="timer-count" id="timer-display">60s</div>
          <div style="font-size: 0.75rem; color: #f59e0b;">⚡ Anti-Snipe Protected</div>
        </div>
      </div>

      <!-- Quick Bidding Actions -->
      <div class="bid-controls">
        <div class="quick-btns">
          <button class="quick-btn" data-increment="2000">+ ₹2,000</button>
          <button class="quick-btn" data-increment="4000">+ ₹4,000</button>
          <button class="quick-btn" data-increment="10000">+ ₹10,000</button>
        </div>

        <div class="custom-bid-row">
          <input type="number" id="custom-bid-input" placeholder="Custom bid amount (₹)" />
          <button id="place-bid-btn">Place Bid 🔨</button>
        </div>
      </div>
    </section>

    <!-- Right Live History Stream -->
    <aside class="history-sidebar">
      <div class="sidebar-heading">
        <span>📜 Live Bid Ticker</span>
        <span style="font-size: 0.8rem; color: #10b981;">• Active Feed</span>
      </div>
      <div class="history-list" id="history-list">
        <!-- Live Bid Items rendered here -->
      </div>
    </aside>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
